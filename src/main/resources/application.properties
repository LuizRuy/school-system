# --- Open endpoints catalog -------------------------------------------------
# Public (unauthenticated) endpoints are declared in exactly one place:
# OpenEndpoints.DEFINITIONS. SecurityConfig permits them anonymously and
# OpenEndpointRateLimitFilter rate-limits them per client IP, so adding an
# entry there needs no other edit.
#
# Optional per-entry overrides, keyed by catalog entry name:
# school.open-endpoints.limits.login.limit=15
# school.open-endpoints.limits.register.window=PT2M

# Client IP resolution for rate limiting.
# 0 (default): only the TCP peer address is trusted; forwarded headers are
#              ignored because any client can forge them.
# N > 0: the app sits behind exactly N reverse proxies that APPEND to
#        X-Forwarded-For. The hop your outermost trusted proxy saw wins;
#        anything further left in the chain may be forged by the client.
#        A missing or too-short header falls back to the TCP peer address.
# school.open-endpoints.client-ip.trusted-proxies=0

